# Builds AXIOM from the PRIVATE source repo (mordf0kas/axiom) for macOS (universal) + Windows and
# publishes the installers here. Runs in this PUBLIC repo because Actions minutes are free for public
# repos (the private repos are blocked by GitHub billing). The source is fetched with a read-only
# deploy key (secret AXIOM_SRC_KEY) and never stored here. Run it: Actions -> build -> Run workflow.
name: build
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch / tag / commit of mordf0kas/axiom to build"
        default: main
      label:
        description: "Version label in the installer names"
        default: "1.0-beta"
      windows:
        description: "Also build the Windows installer"
        type: boolean
        default: false
      publish:
        description: "Upload the installers to release v<label> here"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Skip Windows unless asked
        id: gate
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ] && [ "${{ inputs.windows }}" != "true" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - name: Fetch the source (private repo, read-only deploy key)
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: mordf0kas/axiom
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.AXIOM_SRC_KEY }}
          persist-credentials: false
      - name: Fetch JUCE 8.0.4
        if: steps.gate.outputs.run == 'true'
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git JUCE
      - name: Configure
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          # The deployment target (10.15, so macOS 15 and older) is set in CMakeLists.txt before project().
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DJUCE_DIR="$PWD/JUCE"
          else
            cmake -B build -DJUCE_DIR="$PWD/JUCE"
          fi
      - name: Build
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          T="AXIOM_VST3 AXIOM_Standalone AxiomCheck"
          [ "${{ matrix.os }}" = "macos-latest" ] && T="$T AXIOM_AU"
          cmake --build build --config Release --target $T --parallel 4
          # Every factory preset and randomized sound must play cleanly before anything is packaged.
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ./build/AxiomCheck_artefacts/Release/AxiomCheck.exe
          else
            ./build/AxiomCheck_artefacts/Release/AxiomCheck
          fi
          mkdir -p out
          echo "${{ inputs.label }}" > out/VERSION
      - name: Package macOS installer (.pkg, ad-hoc signed, quarantine stripped)
        if: steps.gate.outputs.run == 'true' && matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          R="build/AXIOM_artefacts/Release"; P="Axiom"
          # JUCE writes moduleinfo.json after signing: re-sign so Apple Silicon hosts load the bundles
          for b in "$R/VST3/$P.vst3" "$R/AU/$P.component" "$R/Standalone/$P.app"; do
            codesign --force --deep --sign - "$b" && codesign --verify --deep --strict "$b"
          done
          mkdir -p pkg_root/Library/Audio/Plug-Ins/VST3 pkg_root/Library/Audio/Plug-Ins/Components pkg_root/Applications pkg_scripts
          cp -R "$R/VST3/$P.vst3" pkg_root/Library/Audio/Plug-Ins/VST3/
          cp -R "$R/AU/$P.component" pkg_root/Library/Audio/Plug-Ins/Components/
          cp -R "$R/Standalone/$P.app" pkg_root/Applications/
          # Factory wavetable pack: JUCE's commonApplicationDataDirectory is /Library on macOS.
          WT="pkg_root/Library/Drelva Audio/Axiom/Wavetables"
          mkdir -p "$WT"
          cp -R Wavetables/Drelva "$WT/"
          cat > pkg_scripts/postinstall <<EOS
          #!/bin/bash
          xattr -dr com.apple.quarantine "/Library/Audio/Plug-Ins/VST3/$P.vst3" "/Library/Audio/Plug-Ins/Components/$P.component" "/Applications/$P.app" 2>/dev/null || true
          exit 0
          EOS
          chmod +x pkg_scripts/postinstall
          pkgbuild --analyze --root pkg_root components.plist
          i=0; while plutil -extract "$i" xml1 -o /dev/null components.plist 2>/dev/null; do plutil -replace "$i.BundleIsRelocatable" -bool NO components.plist; i=$((i+1)); done
          V=$(cat out/VERSION)
          pkgbuild --root pkg_root --component-plist components.plist --scripts pkg_scripts --identifier "com.drelvaaudio.axiom.installer" --version "1.0.0" --install-location / component.pkg
          productbuild --package component.pkg "out/AXIOM-v$V-macOS.pkg"
      - name: Package Windows installer (Inno Setup)
        if: steps.gate.outputs.run == 'true' && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $v = (Get-Content out\VERSION).Trim()
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" installer\AXIOM.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          Get-ChildItem installer_out\*.exe | Select-Object -First 1 | Copy-Item -Destination "out\AXIOM-v$v-Windows-Setup.exe"
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: AXIOM-${{ matrix.os }}
          path: out

  release:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload to the release
        run: |
          VERSION=$(tr -d '\r\n' < dist/VERSION); TAG="v$VERSION"
          FILES=(); for f in dist/AXIOM*; do [ -s "$f" ] && FILES+=("$f"); done
          [ ${#FILES[@]} -gt 0 ] || { echo "::error::nothing to upload"; exit 1; }
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --title "AXIOM $TAG" --notes "AXIOM $TAG" --prerelease
          fi
